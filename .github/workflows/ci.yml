name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      GOTELEMETRY: 'off'
      CGO_CFLAGS: ${{ runner.os == 'macOS' && '-mmacosx-version-min=13.0' || '' }}
      CGO_LDFLAGS: ${{ runner.os == 'macOS' && '-mmacosx-version-min=13.0 -framework UniformTypeIdentifiers' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - run: pnpm install --frozen-lockfile
      - run: go mod verify
      - run: go test -race ./...
      - run: go vet ./...
      - name: Go formatting
        shell: bash
        run: test -z "$(gofmt -l pkg cmd desktop_main.go desktop_app.go)"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm cli:build
      - run: go run ./cmd/supabase-toys --help
      - if: runner.os != 'Linux'
        run: go tool wails build -m -nosyncgomod -tags desktop
      - if: runner.os == 'Linux'
        run: go tool wails build -m -nosyncgomod -tags 'desktop,webkit2_41'
      - run: python scripts/test-distribution.py
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-install.ps1
  local-stacks:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        supabase: ['2.119.0', '2.118.0']
    env:
      GOTELEMETRY: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ matrix.supabase }}
      - run: go build -trimpath -o build/bin/supabase-toys ./cmd/supabase-toys
      - run: python3 scripts/check-compatibility.py "$(command -v supabase)"
      - name: Two-project isolation and persistence
        timeout-minutes: 25
        run: TOYS_BINARY="$PWD/build/bin/supabase-toys" SUPABASE_BINARY="$(command -v supabase)" python3 scripts/live-acceptance.py
      - name: Experimental stack adapter
        if: matrix.supabase == '2.119.0'
        timeout-minutes: 20
        run: TOYS_BINARY="$PWD/build/bin/supabase-toys" SUPABASE_BINARY="$(command -v supabase)" python3 scripts/stack-acceptance.py
