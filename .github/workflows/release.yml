name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, os: macos, goos: darwin, arch: arm64, goarch: arm64 }
          - { runner: macos-15, os: macos, goos: darwin, arch: x64, goarch: amd64 }
          - { runner: ubuntu-24.04, os: linux, goos: linux, arch: x64, goarch: amd64 }
          - { runner: ubuntu-24.04-arm, os: linux, goos: linux, arch: arm64, goarch: arm64 }
          - { runner: windows-2022, os: windows, goos: windows, arch: x64, goarch: amd64 }
    runs-on: ${{ matrix.runner }}
    env:
      GOTELEMETRY: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify release version
        shell: bash
        run: python3 scripts/check-release-version.py "$GITHUB_REF_NAME"
      - run: go test -race ./...
      - name: Build standalone CLI
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags '-s -w' -o build/cli/supabase-toys${{ matrix.os == 'windows' && '.exe' || '' }} ./cmd/supabase-toys
      - name: Package CLI
        shell: bash
        run: python3 scripts/package-cli.py --binary "build/cli/supabase-toys${{ matrix.os == 'windows' && '.exe' || '' }}" --version "$GITHUB_REF_NAME" --os ${{ matrix.os }} --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.os }}-${{ matrix.arch }}
          path: release-assets/*
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      GOTELEMETRY: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config squashfs-tools zsync
      - if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: macOS universal app
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: '13.0'
          CGO_CFLAGS: '-mmacosx-version-min=13.0'
          CGO_LDFLAGS: '-mmacosx-version-min=13.0 -framework UniformTypeIdentifiers'
        run: go tool wails build -m -nosyncgomod -tags desktop -platform darwin/universal
      - name: Windows app and NSIS installer
        if: runner.os == 'Windows'
        run: go tool wails build -m -nosyncgomod -tags desktop -nsis
      - name: Linux desktop
        if: runner.os == 'Linux'
        run: go tool wails build -m -nosyncgomod -tags 'desktop,webkit2_41'
      - name: Sign and notarize macOS app
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/sign-macos.sh
      - name: Sign Windows executable and installer
        if: runner.os == 'Windows'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./scripts/sign-windows.ps1
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          python3 scripts/fetch-desktop-tools.py
          chmod +x desktop-tools/appimagetool
          cd desktop-tools
          ./appimagetool --appimage-extract
          cd ..
          python3 scripts/package-desktop.py --os linux --version "$GITHUB_REF_NAME" --appimagetool desktop-tools/squashfs-root/AppRun --runtime-file desktop-tools/runtime
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: release-assets/*
          if-no-files-found: error
  publish:
    needs: [cli, desktop]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect artifacts and checksums
        run: |
          mkdir release-assets
          find artifacts -type f -exec cp {} release-assets/ \;
          cp scripts/install.sh scripts/install.ps1 release-assets/
          cd release-assets
          sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: release-assets/*
